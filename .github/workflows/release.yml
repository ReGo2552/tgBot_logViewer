name: Release

# git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # свежий Go: в бинарник попадают исправления безопасности стандартной библиотеки
          go-version: stable
      - run: make test
      - run: make dist VERSION=${{ github.ref_name }}
      - name: Публикация
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
